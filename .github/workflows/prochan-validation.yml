name: ProChan validation

on:
  push:
    branches:
      - prochan-procomic-update
      - main
    paths:
      - "src/ar/mangapro/**"
      - ".github/workflows/prochan-validation.yml"
  pull_request:
    paths:
      - "src/ar/mangapro/**"
      - ".github/workflows/prochan-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: prochan-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Build ProChan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 25

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: >-
            platforms;android-37.0
            build-tools;36.0.0
            platform-tools

      - name: Detect complete ProChan signing secrets
        id: signing
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.PROCHAN_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.PROCHAN_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.PROCHAN_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.PROCHAN_KEY_ALIAS }}
        run: |
          if [[ -n "$KEYSTORE_B64" && -n "$STORE_PASSWORD" && -n "$KEY_PASSWORD" && -n "$KEY_ALIAS" ]]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Signed release build skipped; add all four ProChan signing secrets to enable it."
          fi

      - name: Check formatting and release lint
        run: >-
          ./gradlew
          :src:ar:mangapro:spotlessCheck
          :src:ar:mangapro:lintRelease
          --no-daemon
          --console=plain

      - name: Restore ProChan signing keystore
        if: steps.signing.outputs.configured == 'true'
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.PROCHAN_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_B64" | base64 --decode > signingkey.jks
          chmod 600 signingkey.jks

      - name: Build signed release APK
        if: steps.signing.outputs.configured == 'true'
        env:
          KEY_STORE_PASSWORD: ${{ secrets.PROCHAN_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.PROCHAN_KEY_PASSWORD }}
          ALIAS: ${{ secrets.PROCHAN_KEY_ALIAS }}
        run: >-
          ./gradlew
          :src:ar:mangapro:assembleRelease
          --no-daemon
          --console=plain

      - name: Upload signed release APK
        if: steps.signing.outputs.configured == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: prochan-signed-release-apk
          path: src/ar/mangapro/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 7
